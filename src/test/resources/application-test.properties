########################
# DATABASE — H2 in-memory
########################
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath*:test-data.sql

########################
# CLOUD
########################
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

########################
# ACTIVEMQ
########################
spring.activemq.broker-url=vm://embedded?broker.persistent=false&broker.useJmx=false
spring.jms.cache.enabled=false
workload.queue.name=trainer.workload.queue

########################
# JWT
########################
jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTMjU2
jwt.expiration=86400000

########################
# METRICS
########################
gym.metrics.trainee.timer=test.trainee.timer
gym.metrics.trainer.timer=test.trainer.timer
gym.metrics.training.timer=test.training.timer
gym.metrics.auth.success=test.auth.success
gym.metrics.auth.failure=test.auth.failure
management.prometheus.metrics.export.enabled=false

########################
# JACKSON
########################
spring.jackson.time-zone=GMT+5
spring.jackson.date-format=yyyy-MM-dd
